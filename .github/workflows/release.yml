name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    name: server ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            packages: ""
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cross linker
        if: matrix.packages != ''
        run: |
          link=$(ip -o route get 1.1.1.1 | awk '{print $5; exit}')
          sudo resolvectl dns "$link" 1.1.1.1 8.8.8.8 || true
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null
          for attempt in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} && exit 0
            sleep 20
          done
          exit 1
      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: cargo build -p ryme-server --release --locked --target ${{ matrix.target }}
      - name: pack
        run: cp target/${{ matrix.target }}/release/ryme-server ryme-server-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ryme-server-${{ matrix.target }}
          path: ryme-server-${{ matrix.target }}

  client:
    name: client ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: ryme
            asset: ryme-x86_64-unknown-linux-gnu
            packages: libfontconfig1-dev libxkbcommon-dev libxcb1-dev
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ryme.exe
            asset: ryme-x86_64-pc-windows-msvc.exe
            packages: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: ryme
            asset: ryme-aarch64-apple-darwin
            packages: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: ryme
            asset: ryme-x86_64-apple-darwin
            packages: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: desktop libraries
        if: matrix.packages != ''
        run: |
          link=$(ip -o route get 1.1.1.1 | awk '{print $5; exit}')
          sudo resolvectl dns "$link" 1.1.1.1 8.8.8.8 || true
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null
          for attempt in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} && exit 0
            sleep 20
          done
          exit 1
      - name: build
        shell: bash
        run: cargo build -p ryme --release --locked --target ${{ matrix.target }}
      - name: pack
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: [server, client]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Server builds for Linux and the Raspberry Pi. The same card for Windows, Mac, and Linux."
