name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  server:
    name: server ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            packages: ""
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cross linker
        if: matrix.packages != ''
        run: |
          link=$(ip -o route get 1.1.1.1 | awk '{print $5; exit}')
          sudo resolvectl dns "$link" 1.1.1.1 8.8.8.8 || true
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null
          for attempt in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} && exit 0
            sleep 20
          done
          exit 1
      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: cargo build -p ryme-server --release --locked --target ${{ matrix.target }}
      - name: pack
        run: cp target/${{ matrix.target }}/release/ryme-server ryme-server-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ryme-server-${{ matrix.target }}
          path: ryme-server-${{ matrix.target }}

  client:
    name: client ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: ryme
            asset: ryme-x86_64-unknown-linux-gnu
            packages: libfontconfig1-dev libxkbcommon-dev libxcb1-dev
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ryme.exe
            asset: ryme-x86_64-pc-windows-msvc.exe
            packages: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: ryme
            asset: ryme-aarch64-apple-darwin
            packages: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: ryme
            asset: ryme-x86_64-apple-darwin
            packages: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: desktop libraries
        if: matrix.packages != ''
        run: |
          link=$(ip -o route get 1.1.1.1 | awk '{print $5; exit}')
          sudo resolvectl dns "$link" 1.1.1.1 8.8.8.8 || true
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null
          for attempt in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} && exit 0
            sleep 20
          done
          exit 1
      - name: build
        shell: bash
        run: cargo build -p ryme --release --locked --target ${{ matrix.target }}
      - name: pack
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0
          $ver = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force -Path packaging\windows\stage | Out-Null
          Copy-Item target\${{ matrix.target }}\release\ryme.exe packaging\windows\stage\ryme.exe
          curl.exe -fsSL -o packaging\windows\stage\vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem "C:\Program Files*" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { throw "Inno Setup compiler was not installed" }
            $iscc = $found.FullName
          }
          & $iscc "/DMyAppVersion=$ver" packaging\windows\ryme.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Ryme-Setup-x64.exe
          path: packaging/windows/out/Ryme-Setup-x64.exe
      - name: Linux package
        if: runner.os == 'Linux'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          packaging/linux/build-deb.sh "$ver" "target/${{ matrix.target }}/release/ryme" packaging/icon/ryme-256.png ryme-amd64.deb
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ryme-amd64.deb
          path: ryme-amd64.deb
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) label=arm64 ;;
            x86_64-apple-darwin) label=intel ;;
          esac
          identity=$(packaging/macos/import-cert.sh)
          if [ -n "$identity" ]; then
            export APPLE_SIGNING_IDENTITY="$identity"
          fi
          packaging/macos/build-dmg.sh "$ver" "target/${{ matrix.target }}/release/ryme" "$label" . packaging/icon/ryme-1024.png
          packaging/macos/notarize.sh "Ryme-mac-${label}.dmg"
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'aarch64-apple-darwin'
        with:
          name: Ryme-mac-arm64.dmg
          path: Ryme-mac-arm64.dmg
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-apple-darwin'
        with:
          name: Ryme-mac-intel.dmg
          path: Ryme-mac-intel.dmg

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ryme-server:${{ steps.ver.outputs.ver }}
            ghcr.io/${{ github.repository_owner }}/ryme-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: public package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "/user/packages/container/ryme-server/visibility" \
            -f visibility=public \
            || echo "The image was pushed. If it is private, make the package public in GitHub package settings."

  publish:
    needs: [server, client]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: dtolnay/rust-toolchain@stable
      - name: sign checksums
        env:
          RYME_UPDATE_PKCS8: ${{ secrets.RYME_UPDATE_PKCS8 }}
        run: |
          if [ -z "$RYME_UPDATE_PKCS8" ]; then
            echo "RYME_UPDATE_PKCS8 is not set. Refusing to publish an unsigned update."
            exit 1
          fi
          printf '%s' "$RYME_UPDATE_PKCS8" | base64 -d > "$RUNNER_TEMP/update.pkcs8"
          cargo build -p ryme-server --release --locked
          ./target/release/ryme-server --sign-sums dist/SHA256SUMS "$RUNNER_TEMP/update.pkcs8"
          rm -f "$RUNNER_TEMP/update.pkcs8"
          test -s dist/SHA256SUMS.sig
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Windows setup, Mac disk images, and a Linux package. Server builds for Linux and the Raspberry Pi."
