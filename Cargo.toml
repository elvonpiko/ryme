[package]
name = "ryme"
version = "0.1.8"
edition = "2021"

[dependencies]
bytes = "1.12.1"
magnum-opus = "0.3.2"
rtrb = "0.4.1"
ryme-proto = { path = "crates/ryme-proto" }
ryme-server = { path = "crates/ryme-server" }
slint = { version = "1", features = ["raw-window-handle-06"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["shape"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Linux talks to the installed libasound directly. Other desktops use cpal.
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"

[build-dependencies]
slint-build = "1"

[workspace]
members = ["crates/ryme-proto", "crates/ryme-server"]
resolver = "2"

[patch.crates-io]
opusic-sys = { path = "crates/opusic-sys" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
