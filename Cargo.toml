[package]
name = "ryme"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1", features = ["raw-window-handle-06"] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11rb = { version = "0.13.2", features = ["shape"] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
