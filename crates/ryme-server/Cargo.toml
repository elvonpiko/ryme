[package]
name = "ryme-server"
version = "0.1.0"
edition = "2021"
description = "Ryme voice relay"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
quinn = "0.11.12"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ryme-proto = { path = "../ryme-proto" }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
